# The Pipeline's git token (spec.git.secretRef, key token): the workshop's GitLab PAT from
# Secrets Manager ${{values.cluster_name}}/secrets. Kardinal sends it only to spec.git.url, and
# only from a Secret labelled kardinal.io/referenceable=true. It is not the controller's own
# SCM token (kardinal-system/kardinal-scm-token).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-git
  namespace: ${{values.appname}}-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gitlab-git
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kardinal.io/referenceable: "true"
  data:
  - secretKey: token
    remoteRef:
      key: ${{values.cluster_name}}/secrets
      property: git_token
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
