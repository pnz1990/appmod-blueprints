# Workshop: pin Kardinal (hub only, hub.kroMode=upstream) to the tuned system-peeks pool,
# like every other platform controller here. The built-in `system` pool allows arm64 and
# would launch an extra node just for it. This local chart wraps the upstream
# kardinal-promoter chart under the `kardinal-promoter` key; the base values
# (addons/charts/kardinal) keep compute-type/os and the CriticalAddonsOnly toleration,
# which system-peeks needs.
kardinal-promoter:
  nodeSelector:
    karpenter.sh/nodepool: system-peeks
