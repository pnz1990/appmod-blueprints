# GitOps tooling addons
# Wave ordering: 3 (rollouts/events) → 4 (kargo/kardinal/flux) → 7 (argo-workflows, after keycloak)

argo-rollouts:
  namespace: argo-rollouts
  chartName: argo-rollouts
  chartRepository: https://argoproj.github.io/argo-helm
  defaultVersion: '2.40.9'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '3'
  selector:
    matchExpressions:
      - key: enable_argo_rollouts
        operator: In
        values: ['true']
  valuesObject:
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: 'arn:aws:iam::{{.metadata.annotations.aws_account_id}}:role/{{.metadata.annotations.aws_cluster_name}}-argo-rollouts'

argo-events:
  namespace: argo-events
  chartName: argo-events
  chartRepository: https://argoproj.github.io/argo-helm
  defaultVersion: '2.4.21'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '3'
  selector:
    matchExpressions:
      - key: enable_argo_events
        operator: In
        values: ['true']
  valuesObject:
    controller:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

argo-workflows:
  namespace: argo
  path: '{{.metadata.annotations.addonsRepoBasepath}}addons/charts/argo-workflows'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '7'
  selector:
    matchExpressions:
      - key: enable_argo_workflows
        operator: In
        values: ['true']
  valuesObject:
    ingress_domain_name: '{{.metadata.annotations.ingress_domain_name}}'
    gitlab_domain_name: '{{.metadata.annotations.gitlab_domain_name}}'
    insecure: '{{default "false" .metadata.annotations.insecure}}'
    aws_cluster_name: '{{.metadata.annotations.aws_cluster_name}}'
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
        - /metadata/resourceVersion
        - /metadata/generation
        - /metadata/managedFields
      jqPathExpressions:
        - '.spec.data[]?.remoteRef.nullBytePolicy'
        - '.spec.dataFrom[]?.extract.nullBytePolicy'
    - group: ''
      kind: Secret
      name: keycloak-oidc
      jsonPointers:
        - /metadata/resourceVersion
        - /metadata/managedFields

kargo:
  namespace: kargo
  # Local umbrella chart: wraps the upstream Kargo chart as a dependency (values
  # nested under the `kargo:` key) and adds the platform API Ingress, rendered
  # locally so it can switch ALB listeners on the `insecure` flag with a block
  # conditional — like the other platform ingresses (argo-workflows/backstage/
  # keycloak). One `enable_kargo` flip brings up Kargo + its ingress together.
  path: '{{.metadata.annotations.addonsRepoBasepath}}addons/charts/kargo'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '4'
  selector:
    matchExpressions:
      - key: enable_kargo
        operator: In
        values: ['true']
  valuesObject:
    # Consumed by this umbrella chart's own templates (the API Ingress).
    global:
      ingress_domain_name: '{{.metadata.annotations.ingress_domain_name}}'
      # insecure=true  → ALB serves HTTP:80 (CloudFront terminates TLS upstream).
      # insecure=false → ALB serves HTTPS:443 + ssl-redirect. See templates/ingress.yaml.
      insecure: '{{default "false" .metadata.annotations.insecure}}'
    # Passed through to the upstream Kargo chart (dependency, key `kargo`).
    kargo:
      api:
        host: '{{.metadata.annotations.ingress_domain_name}}'
        basePath: /kargo
        tls:
          enabled: false
          terminatedUpstream: true
        ingress:
          # Disabled: the Ingress is rendered by this chart's own templates/ingress.yaml
          # (insecure-aware) instead of by the upstream chart.
          enabled: false
        argocd:
          urls:
            argocd: https://{{.metadata.annotations.ingress_domain_name}}/argocd
        oidc:
          # Kargo SSO via Keycloak (public client 'kargo' is seeded in the platform
          # realm by the keycloak-config job; PKCE flow, no client secret required).
          # NOTE: all four of enabled/issuerURL/clientID are required — the chart only
          # renders the OIDC_* config (and the UI "Log in with SSO" button) when they
          # are set. With issuerURL alone the chart silently falls back to admin-only
          # login (ADMIN_ACCOUNT_ENABLED) and no SSO is offered.
          enabled: true
          issuerURL: https://{{.metadata.annotations.ingress_domain_name}}/keycloak/realms/platform
          clientID: kargo
          cliClientID: kargo
          # Request the 'groups' scope so the groups claim is returned (admin mapping below).
          additionalScopes:
            - groups
          # user1 is in the Keycloak '/admin' group; the realm's 'groups' client scope
          # emits a 'groups' claim, so grant Kargo admin to members of '/admin'.
          admins:
            claims:
              groups:
                - admin
        secret:
          name: kargo-admin-credentials
      extraObjects:
        - apiVersion: external-secrets.io/v1
          kind: ExternalSecret # For Kargo Admin Credentials
          metadata:
            name: kargo-admin-credentials
            namespace: kargo
            annotations:
              argocd.argoproj.io/sync-wave: '-1'
          spec:
            refreshInterval: '30s'
            secretStoreRef:
              name: aws-secrets-manager
              kind: ClusterSecretStore
            target:
              name: kargo-admin-credentials
              creationPolicy: Owner
              deletionPolicy: Retain
              template:
                engineVersion: v2
                mergePolicy: Replace
                data:
                  ADMIN_ACCOUNT_PASSWORD_HASH: '{{ printf "{{ `{{ .KARGO_ADMIN_PASSWORD_HASH }}` }}" }}'
                  ADMIN_ACCOUNT_TOKEN_SIGNING_KEY: '{{ printf "{{ `{{ .KARGO_ADMIN_PASSWORD_KEY }}` }}" }}'
            data:
              - secretKey: KARGO_ADMIN_PASSWORD_HASH
                remoteRef:
                  key: '{{.metadata.annotations.aws_cluster_name}}/secrets'
                  property: user_password_hash
                  conversionStrategy: Default
                  decodingStrategy: None
                  metadataPolicy: None
              - secretKey: KARGO_ADMIN_PASSWORD_KEY
                remoteRef:
                  key: '{{.metadata.annotations.aws_cluster_name}}/secrets'
                  property: user_password_key
                  conversionStrategy: Default
                  decodingStrategy: None
                  metadataPolicy: None
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
        - /metadata/generation
        - /metadata/managedFields

# Kardinal (kardinal-promoter): Kubernetes-native promotion (Pipeline / Bundle / PolicyGate)
# that writes GitOps commits to GitLab and checks the hub's Argo CD Applications. Local
# umbrella chart over oci://ghcr.io/pnz1990/charts/kardinal-promoter, which adds the Secrets
# the controller reads (from External Secrets): the GitLab SCM token from
# <cluster>/secrets.git_token, a generated Bundle API token for CI, and the read-only
# ClusterSecretStore kardinal-bundle-api through which the team-* CI namespaces copy it.
#
# Opt-in and off by default: only a cluster labelled enable_kardinal gets it. On the
# kind-kro-ack hub the label comes from hub.kroMode=upstream (secrets-manager:seed), with
# enable_kro_upstream: Kardinal builds one kro Graph (kro.run/v1alpha1) per Bundle, which
# only the kro-upstream addon serves (wave -3); the EKS managed kro capability does not yet.
# Hub only: it reads the hub's Argo CD Applications (health.type argocd) where it runs.
#
# Wave 4 (Platform / GitOps, with kargo): after kro-upstream and external-secrets. The chart
# ships 18 CRDs, ClusterRoles, 8 ValidatingAdmissionPolicies and a FlowSchema, so the
# Application's project must allow cluster-scoped kinds (default does). ServerSideApply, as
# for kro-upstream, so CRD upgrades are applied (Helm itself never upgrades crds/).
kardinal:
  namespace: kardinal-system
  path: '{{.metadata.annotations.addonsRepoBasepath}}addons/charts/kardinal'
  # Release "kardinal-promoter": Deployment, ServiceAccount and Service "kardinal-promoter",
  # the names `kardinal doctor` and the CLI look for.
  releaseName: kardinal-promoter
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '4'
  selector:
    matchExpressions:
      - key: enable_kardinal
        operator: In
        values: ['true']
  valuesObject:
    clusterName: '{{.metadata.annotations.aws_cluster_name}}'
    # Keycloak SSO for the UI at https://<ingress_domain_name>/ui/ (templates/sso.yaml):
    # oauth2-proxy (Keycloak client `kardinal`, created by the keycloak-config job) in front,
    # an EKS OIDC identity provider for Keycloak on this cluster (ACK, namespace
    # <aws_cluster_name>), so Kardinal's TokenReview knows the Keycloak user, and the
    # chart's user roles bound to the Keycloak groups. The three kardinal-promoter values
    # below are what that needs; the chart refuses sso.enabled without them.
    sso:
      enabled: true
      ingressDomainName: '{{.metadata.annotations.ingress_domain_name}}'
      insecure: '{{default "false" .metadata.annotations.insecure}}'
    kardinal-promoter:
      scm:
        apiURL: 'https://{{.metadata.annotations.gitlab_domain_name}}'
        allowedRepositories:
          - '{{.metadata.annotations.gitlab_domain_name}}/**'
      ui:
        # The Host oauth2-proxy passes on (the browser's).
        allowedHosts:
          - '{{.metadata.annotations.ingress_domain_name}}'
      tokenReview:
        # A Keycloak ID token is an API-server-audience token for TokenReview (the OIDC
        # authenticator is not audience-aware), so it is refused without this. It means
        # Kardinal also accepts kubeconfig and default ServiceAccount tokens; RBAC still
        # decides what each caller sees and does.
        acceptAPIServerAudience: true
  # Replicates the inherited default syncPolicy (a per-addon syncPolicy fully overrides
  # it) and adds ServerSideApply.
  syncPolicy:
    automated:
      selfHeal: true
      allowEmpty: true
      prune: false
    retry:
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Leave the ignored fields below out of the apply too (the aggregated rules).
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
        - /metadata/generation
        - /metadata/managedFields
      jqPathExpressions:
        - '.spec.data[]?.remoteRef.nullBytePolicy'
        - '.spec.dataFrom[]?.extract.nullBytePolicy'
    # An aggregated ClusterRole (aggregationRule): the chart renders `rules: []` and the
    # API server's aggregation controller fills in the rules, so it was OutOfSync for ever.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kardinal-promoter-admin
      jsonPointers:
        - /rules
