{{- $kp := index .Values "kardinal-promoter" }}
{{- $scmSecret := $kp.scm.secretRef.name }}
{{- $bundleSecret := $kp.bundleAPI.tokenSecretRef.name }}
{{- $reader := printf "%s-reader" .Values.bundleAPI.clientStoreName }}
{{- if not .Values.clusterName }}
{{- fail "clusterName is required: the GitLab token is read from <clusterName>/secrets" }}
{{- end }}
# The controller's GitLab token (scm.secretRef, key token): user1's PAT from
# <hub>/secrets.git_token. The controller watches this Secret and reloads the token
# when it changes. Wave -1, so it exists before the controller Pod starts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $scmSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $scmSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $kp.scm.secretRef.key | default "token" }}
      remoteRef:
        key: {{ .Values.clusterName }}/secrets
        property: git_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Bundle API bearer token (bundleAPI.tokenSecretRef, key token): random, generated once.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $bundleSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $bundleSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  # Never regenerate: the controller reads the token at startup and every CI namespace
  # holds a copy (ExternalSecret through the ClusterSecretStore below).
  refreshPolicy: CreatedOnce
  target:
    name: {{ $bundleSecret }}
    creationPolicy: Owner
    template:
      data:
        {{ $kp.bundleAPI.tokenSecretRef.key | default "token" }}: '{{ "{{ .password }}" }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $bundleSecret }}
---
# Read-only access to the Bundle API token for the CI namespaces, the pattern of the devlake
# addon's devlake-k8s-local store: a ServiceAccount that may get that one Secret (no list or
# watch, so a store user cannot read any other Secret here), and a ClusterSecretStore that
# authenticates as it and serves only the namespaces in bundleAPI.clientNamespaceRegexes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $reader }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $reader }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
rules:
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['get']
    resourceNames: [{{ $bundleSecret | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $reader }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
subjects:
  - kind: ServiceAccount
    name: {{ $reader }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $reader }}
---
# The kubernetes provider validates the store with a SelfSubjectRulesReview.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $reader }}-review
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
rules:
  - apiGroups: ['authorization.k8s.io']
    resources: ['selfsubjectrulesreviews']
    verbs: ['create']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $reader }}-review
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
subjects:
  - kind: ServiceAccount
    name: {{ $reader }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $reader }}-review
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.bundleAPI.clientStoreName }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  conditions:
    - namespaceRegexes:
        {{- toYaml .Values.bundleAPI.clientNamespaceRegexes | nindent 8 }}
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: {{ $reader }}
          namespace: {{ .Release.Namespace }}
