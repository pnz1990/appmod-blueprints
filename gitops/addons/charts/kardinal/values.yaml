# Consumed by this umbrella chart's own templates (templates/secrets.yaml). The registry
# entry (addons/registry/gitops.yaml) sets clusterName from the cluster secret. The Secret
# names come from the kardinal-promoter values below (scm.secretRef.name,
# bundleAPI.tokenSecretRef.name), so the two cannot drift.
#
# Hub cluster name: the GitLab token is read from Secrets Manager <clusterName>/secrets,
# property git_token (user1's PAT, which the workshop's other GitLab clients read too).
clusterName: ""
# ClusterSecretStore that reads Secrets Manager (the cluster-secret-store addon).
secretStore: aws-secrets-manager

bundleAPI:
  # ClusterSecretStore (kubernetes provider, read-only on the token Secret) through which a
  # CI namespace copies the Bundle API token with its own ExternalSecret (the cicd-pipeline
  # RGD, kardinal.enabled). Only namespaces matching these regexes may use it. The token is
  # a single-tenant admin credential of the Bundle API: whoever holds it can create a Bundle
  # for any Pipeline. For several tenants, use the Bundle API's TokenReview mode instead.
  clientStoreName: kardinal-bundle-api
  clientNamespaceRegexes:
    - '^team-'

# Argo CD health check for kro AppmodService instances (templates/argocd-health.yaml,
# files/appmodservice-health.lua). With the AppmodService RGD's status.rollout, an aborted
# canary makes the instance, and so its Argo CD Application, Degraded at once; without it the
# Application stays Progressing, and Kardinal (health.type argocd) only sees the failure at
# health.timeout. Applied as the argocd-cm ConfigMap the EKS Argo CD capability reads, and only
# when capabilityURL is set (the registry entry passes the cluster secret's aws_argocd_url,
# which only a capability hub has). For a self-managed Argo CD, add the same key,
# resource.customizations.health.kro.run_AppmodService, to its argocd-cm instead.
argocdHealth:
  enabled: true
  capabilityURL: ""
  # The capability's namespace (configuration.argoCd.namespace).
  namespace: argocd

# Single sign-on for the Kardinal UI with the platform's Keycloak (templates/sso.yaml).
# Kardinal's UI has no OIDC login of its own; it authenticates every UI API call with a
# Kubernetes TokenReview and authorizes it with a SubjectAccessReview for that user. So:
#   browser -> ALB (/ui, /api/v1/ui) -> oauth2-proxy (Keycloak login, client `clientID`)
#   -> Kardinal UI with "Authorization: Bearer <Keycloak ID token>"
#   -> TokenReview: the cluster's API server trusts Keycloak through an EKS OIDC identity
#      provider (ACK IdentityProviderConfig below), so the user is oidc:<username> with
#      groups oidc:<group> -> RBAC from the ClusterRoleBindings below.
# Every UI action, approvals included, is then made and recorded as the Keycloak user.
# Needs, in the kardinal-promoter values below: ui.auth.tokenReview=true,
# tokenReview.acceptAPIServerAudience=true (an ID token has the API server's audience for
# TokenReview, not kardinal-promoter) and ui.allowedHosts=[ingressDomainName]. The registry
# entry sets them together with sso.enabled.
sso:
  enabled: false
  # Platform domain (CloudFront) the UI is served on, at the root paths /ui and /api/v1/ui
  # (the UI's asset and API paths are absolute, so it cannot live under a prefix).
  ingressDomainName: ""
  # "true": the ALB listens on HTTP:80 and CloudFront terminates TLS (like the other
  # platform Ingresses); otherwise HTTPS:443 with an ssl-redirect and a host rule.
  insecure: "false"
  # Keycloak realm on the platform domain, and the confidential client the keycloak-config
  # job creates (its secret lands in Secrets Manager <clusterName>/keycloak-clients).
  issuerPath: /keycloak/realms/platform
  clientID: kardinal
  clientSecretProperty: KARDINAL_CLIENT_SECRET
  oauth2Proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    replicas: 1
    # oauth2-proxy's own endpoints (sign-in, callback) live under /ui so the UI claims no
    # root path besides /ui and /api/v1/ui. The Keycloak client redirect URI is
    # https://<ingressDomainName><proxyPrefix>/callback.
    proxyPrefix: /ui/oauth2
    # Keycloak's tokens live 1h (realm accessTokenLifespan); refresh the session (and with
    # it the ID token passed to Kardinal) well before that. The session ends with the
    # Keycloak SSO session (ssoSessionIdleTimeout 10h).
    cookieRefresh: 30m
    cookieExpire: 10h
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  eksIdentityProvider:
    # EKS OIDC identity provider for this cluster, reconciled by ACK (eks.services.k8s.aws
    # IdentityProviderConfig) in the namespace ACK's IAMRoleSelector for this cluster's EKS
    # resources covers (default: clusterName). EKS allows one OIDC provider per cluster.
    # The prefixes keep Keycloak names apart from IAM and ServiceAccount users: no Keycloak
    # user or group can become system:* or an IAM-mapped name.
    enabled: true
    namespace: ""
    name: keycloak
    usernameClaim: preferred_username
    usernamePrefix: "oidc:"
    groupsClaim: groups
    groupsPrefix: "oidc:"
  # Keycloak groups (without the prefix) bound to the chart's user roles on every namespace
  # (ClusterRoleBindings). user1 is in admin, user2 in editor, user3 in viewer. A Pipeline
  # namespace can bind more with its own RoleBindings.
  roleBindings:
    viewer: [admin, editor, viewer]
    promoter: [admin]
    approver: [admin]

# Passed through to the upstream kardinal-promoter chart (dependency, key
# `kardinal-promoter`). Its values schema rejects unknown keys.
kardinal-promoter:
  scm:
    # GitLab is the workshop SCM. apiURL and allowedRepositories come from the cluster's
    # gitlab_domain_name annotation (registry entry).
    provider: gitlab
    apiURL: ""
    # The controller's token (MRs, merge detection). Kardinal requires it to be separate
    # from every Pipeline's git Secret: it is never labelled kardinal.io/referenceable and
    # never named in a Pipeline's spec.git.secretRef.
    secretRef:
      name: kardinal-scm-token
      key: token
    allowedRepositories: []
  bundleAPI:
    # POST :8083/api/v1/bundles from the in-cluster CI (Argo Workflows on the hub). The
    # token is generated once by an External Secrets Password generator and never rotated.
    tokenSecretRef:
      name: kardinal-bundle-api-token
      key: token
    # Also accept Kubernetes tokens (TokenReview + SubjectAccessReview): a CI ServiceAccount
    # bound to the promoter role in a Pipeline namespace may create its Bundles with its own
    # projected token (CICDPipeline kardinal.auth "tokenreview"), and the Bundle records it
    # as the verified creator. The static token keeps working for the others.
    tokenReview: true
  # The SCM webhook secret (templates/secrets.yaml generates it): POST :8083/webhook/scm with
  # X-Gitlab-Token. The port is in-cluster only; GitLab needs a route to it (see the secret).
  webhook:
    secretRef:
      name: kardinal-scm-webhook
      key: secret
  ui:
    auth:
      # Every UI API call is authenticated with a TokenReview and authorized with the caller's
      # RBAC, so UI approvals are recorded under the caller's name. With `sso` (above), the
      # caller is the Keycloak user, whose ID token oauth2-proxy forwards; a Kubernetes token
      # pasted into the UI's sign-in dialog (kubectl create token <sa> --audience
      # kardinal-promoter) works too, e.g. through a port-forward.
      tokenReview: true
  graph:
    # The Graph ServiceAccount may read health objects here: the hub's Argo CD
    # Applications (health.type argocd). Flux does not run on the hub.
    readerNamespaces:
      - argocd
  # Same placement as the other platform controllers (see addons/charts/kro-upstream).
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  nodeSelector:
    eks.amazonaws.com/compute-type: auto
    kubernetes.io/os: linux
    karpenter.sh/nodepool: system
