# The Pipeline's git token (spec.git.secretRef, key token): the GitLab PAT. Kardinal sends it
# only to spec.git.url, and only from a Secret labelled kardinal.io/referenceable=true, which
# records that its owner allows Pipelines to use it. This is not the controller's own SCM
# token Secret (kardinal-system/kardinal-scm-token, never referenceable).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-git
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.gitToken.secretStore }}
    kind: ClusterSecretStore
  target:
    name: gitlab-git
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kardinal.io/referenceable: "true"
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.gitToken.key }}
        property: {{ .Values.gitToken.property }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
