# Set by the Argo CD Application (../argocd-application.yaml).
app: rust
gitlab:
  # https://<GitLab host> ($GITLAB_URL on the IDE). The repo URL must end in .git: Argo CD
  # does not follow GitLab's redirect, and Kardinal compares the URL with the Applications'.
  url: ""
  username: user1
# Secrets Manager secret and property holding the GitLab PAT, read through External Secrets.
gitToken:
  secretStore: aws-secrets-manager
  key: peeks-hub/secrets
  property: git_token
# How long a promoted commit may take to be synced and Healthy (the canary and its analysis
# gates on the spoke count: the AppmodService turns Ready only once its Rollout is Healthy).
# An environment can set its own healthTimeout.
healthTimeout: 20m
# The environments, in promotion order. argocdApp: the Argo CD Application the CICDPipeline's
# Backstage template created (rust-cicd repo); Kardinal checks it (health.type argocd):
# Healthy, Synced, and synced at the promoted commit. Default <app>-<env>-cd.
environments:
  dev:
    argocdApp: ""
  prod:
    argocdApp: ""
# PolicyGates of this namespace (scope team), each holding the environment named in
# appliesTo until its CEL expression is true (docs: policy-gates.md, reference/cel-context.md).
# A version gets the gates that exist when it starts promoting. message and expression are
# rendered with tpl, so they may use {{ .Values.app }} and {{ .Release.Namespace }}.
gates:
  # prod needs a person: kardinal approve <app> prod -n <app>-app (or the UI, TokenReview
  # sign-in). Replaces Kargo's manual Promote on the prod Stage.
  prod-approval:
    enabled: true
    appliesTo: prod
    expression: "true"
    message: "prod needs an approval: kardinal approve {{ .Values.app }} prod -n {{ .Release.Namespace }}"
    approval:
      required: 1
