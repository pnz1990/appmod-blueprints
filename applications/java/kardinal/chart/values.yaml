# Set by the Argo CD Application (../argocd-application.yaml).
app: java
gitlab:
  # https://<GitLab host> ($GITLAB_URL on the IDE). The repo URL must end in .git: Argo CD
  # does not follow GitLab's redirect, and Kardinal compares the URL with the Applications'.
  url: ""
  username: user1
# Secrets Manager secret and property holding the GitLab PAT, read through External Secrets.
gitToken:
  secretStore: aws-secrets-manager
  key: peeks-hub/secrets
  property: git_token
# The Argo CD Applications the CICDPipeline's Backstage template created (java-cicd repo).
# Kardinal checks them (health.type argocd): Healthy, Synced, and synced at the promoted commit.
environments:
  dev:
    argocdApp: ""     # default <app>-dev-cd
  prod:
    argocdApp: ""     # default <app>-prod-cd
# How long a promoted commit may take to be synced and Healthy (the canary and its analysis
# gates on the spoke count: the AppmodService turns Ready only once its Rollout is Healthy).
healthTimeout: 20m
# Approvals prod needs (kardinal approve <app> prod, or the Kardinal UI).
prodApprovals: 1
# Per-team CI identity for the Bundle API instead of the static token (docs:
# ci-integration.md, Kubernetes tokens): a Role that may get this namespace's Pipelines and
# create Bundles, bound to the CI ServiceAccount, the two rights Kardinal's SubjectAccessReview
# checks. Used once the CICDPipeline sets kardinal.auth: "tokenreview" (java-cicd repo,
# manifests/kro-cicd-pipeline.yaml; the kardinal addon has bundleAPI.tokenReview); harmless
# while CI sends the static token. clusterRole: bind that ClusterRole instead (Kardinal's
# kardinal-promoter-promoter also grants pause, hold and reject).
ciTokenReview:
  enabled: true
  clusterRole: ""
  serviceAccount: ""   # default <app>-cicd-sa
  namespace: ""        # default team-<app>
